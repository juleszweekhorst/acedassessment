<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AcedAssessment</title>
  <!-- load css package -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 p-0 w-full h-full font-sans overflow-hidden relative bg-transparent">

  <!-- Instruction banner -->
  <div id="instruction-banner" class="fixed top-0 left-1/2 -translate-x-1/2 bg-fuchsia-600/85 text-white text-sm px-4 py-2 rounded-b-lg z-[9999] shadow-md transition-opacity select-none">
    <!-- Text will be filled dynamically -->
  </div>

  <!-- Response overlay -->
  <div id="response-overlay" class="fixed inset-0 bg-purple-700/50 invisible transition-all duration-300 z-[9998] backdrop-blur-sm">
    <div id="response-box" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-[900px] max-h-[90vh] overflow-y-auto bg-purple-800/60 text-white p-6 text-sm leading-relaxed rounded-lg shadow-xl">
      <!-- Response content will be injected here -->
    </div>
  </div>
  <!-- JS + Marked -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/renderer.js"></script>
</body>
</html>
